services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tulospalvelu-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: psql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tulospalvelu
      DB_USER: tulospalvelu
      DB_PASSWORD: tulospalvelu
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:15-alpine
    container_name: tulospalvelu-db
    environment:
      POSTGRES_DB: tulospalvelu
      POSTGRES_USER: tulospalvelu
      POSTGRES_PASSWORD: tulospalvelu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  postgres-data:
